    - title: NLP Data Scientist
      institution: <a href='https://www.concertai.com/'>ConcertAI</a>
      year: 2022 - now
      description: >
        As an NLP data scientist at a leading healthcare AI solutions 
        company, my role revolves around leveraging cutting-edge NLP 
        models to curate Real World Data (RWD) and accelerate oncology 
        research. I am building in-house state-of-the-art biomedical
        models for various clinical tasks such as entity identification,
        entity linking to standard concepts, classification and 
        relationship extraction utilising latest large language model (LLM)
        architectures.

        I have been involved in causal LM (generative models) training and
        fine-tuning efforts on biomedical domain to assess the effectiveness 
        of these models on internal use-cases. I've gained experience on
        SOTA training infrastructure with these projects such as
        distributed systems (Deepspeed ZeRO/ FSDP on NVIDIA A100s), 
        🤗 transformers and several model architechtures.

        I've been designing and building an intenal platform from ground-up
        which utilises LLMs end-to-end as orchestrator and writing assistants.

    - title: Data Scientist
      institution: <a href='https://www.assetmanagement.hsbc.co.in/en'>HSBC Asset Management</a>
      year: 2019 - 2022
      description:
        - title: ESG Engine
          contents: >
            I developed an end-to-end centralized ESG framework, enabling 
            accurate ESG score assessments for a vast array of financial 
            instruments. Leveraging PySpark, I engineered an efficient data 
            sourcing and aggregation engine on a multi-node GCP Dataproc 
            cluster. Additionally, I successfully fine-tuned a BERT-based 
            financial text sentiment model to proactively identify the 
            prevailing market narrative surrounding entities and its potential 
            impact on future ratings. Through strategic optimizations utilizing 
            the BigQuery engine and Spark configurations, I achieved an impressive 
            40% improvement in the framework's run-time.
        - title: Venture Capital Investments
          contents: >
            I undertook the development of a statistical machine learning model 
            with the venture capital team, aimed at predicting the likelihood of 
            success for early-stage startups. By leveraging relevant startup data, 
            such as financial metrics, market trends, and team composition, I 
            released a proof-of-concept (PoC) model which quantified the potential 
            success of early-stage ventures, providing valuable insights to inform 
            investment decisions and mitigate risks.
    - title: Internship
      institution: <a href='https://www.sharekhan.com/'>Sharekhan by BNP Paribas</a>
      year: 2014
      description: >
        I developed a cross-sell ML ensemble model using R to predict the likelihood 
        of existing equity clients transitioning into mutual fund investments, 
        especially SIP subscriptions. The project identified a list of 
        high-propensity clients for the sales teams. Through the research on 
        exisiting SIP clients' behaviors and comprehensive profiling, we could 
        also determine optimal communication channels for these clients.
